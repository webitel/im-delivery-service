asyncapi: 3.0.0
info:
  title: Webitel IM Delivery Service
  version: 1.0.0
  description: WebSocket API for real-time chat delivery.

channels:
  ws:
    address: /ws/im
    messages:
      ServerEvent:
        $ref: '#/components/messages/ServerEvent'

operations:
  receiveEvents:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerEvent'

components:
  messages:
    ServerEvent:
      name: ServerEvent
      payload:
        $ref: '#/components/schemas/ServerEventPayload'

  schemas:
    # --- ENVELOPE ---
    ServerEventPayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: integer
          format: int64
        priority:
          $ref: '#/components/schemas/EventPriority'
        payload:
          $ref: '#/components/schemas/EventPayload'

    EventPriority:
      type: integer
      enum: [0, 1, 2, 3]
      x-enumNames: ["unspecified", "high", "normal", "low"]

    # --- POLYMORPHIC PAYLOAD ---
    EventPayload:
      type: object
      properties:
        connected_event:
          $ref: '#/components/schemas/ConnectedPayload'
        disconnected_event:
          $ref: '#/components/schemas/DisconnectedPayload'
        message_event:
          $ref: '#/components/schemas/WSMessage'
        thread_created_event:
          $ref: '#/components/schemas/WSThread'
        ack_event:
          $ref: '#/components/schemas/AckPayload'
        error_event:
          $ref: '#/components/schemas/ErrorPayload'
        ping_event:
          $ref: '#/components/schemas/PingPayload'

    # --- PAYLOAD DETAILS ---
    ConnectedPayload:
      type: object
      properties:
        ok: { type: boolean }
        connection_id: { type: string }
        server_version: { type: string }

    DisconnectedPayload:
      type: object
      properties:
        reason: { type: string }
        code: { type: integer }
        status: { type: string }

    AckPayload:
      type: object
      properties:
        id: { type: string }
        status: { type: string }

    ErrorPayload:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    PingPayload:
      type: object
      properties:
        timestamp: { type: integer, format: int64 }

    # --- DATA MODELS (Updated to match Go structs) ---
    
    WSContact:
      type: object
      required: [sub, type]
      properties:
        sub: 
          type: string
          description: "Subject identifier"
        iss: 
          type: string
          description: "Issuer"
        name: 
          type: string
        username: 
          type: string
        type: 
          type: string
          description: "Normalized type (e.g. user, bot, agent)"
        is_bot: 
          type: boolean

    WSPeer:
      type: object
      properties:
        id: 
          type: string
          description: "Member identifier"
        contact:
          $ref: '#/components/schemas/WSContact'
        role: 
          type: string
          description: "Role (e.g. member, admin)"

    WSMessage:
      type: object
      properties:
        id: 
          type: string
          format: uuid
        send_id: 
          type: string
        thread_id: 
          type: string
          format: uuid
        sender: 
          $ref: '#/components/schemas/WSPeer'
        to: 
          type: array
          items:
            $ref: '#/components/schemas/WSPeer'
        created_at: 
          type: integer
          format: int64
        edited_at: 
          type: integer
          format: int64
        body: 
          type: string
        type: 
          type: string
          enum: ["text", "image", "document"]
        images:
          type: array
          items:
            type: object
            additionalProperties: true
        documents:
          type: array
          items:
            type: object
            additionalProperties: true

    WSThread:
      type: object
      properties:
        id: { type: string, format: uuid }
        domain_id: { type: integer }
        created_at: { type: integer, format: int64 }
        subject: { type: string }
        type: { type: string }
        members:
          type: array
          items:
            $ref: '#/components/schemas/WSPeer'